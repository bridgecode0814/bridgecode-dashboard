<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>BridgeCode Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%;font-family:"Noto Sans KR",sans-serif}
:root{--sb:#0f1117;--sh:#1a1d27;--sa:#1e2235;--navy:#1a2f6e;--bd:#e5e7eb;--bdd:rgba(255,255,255,0.08);--tp:#111827;--ts:#6b7280;--tm:#9ca3af;--bg:#f9fafb;--sf:#fff}
.app{display:flex;flex-direction:column;height:100vh;background:var(--bg)}
.topbar{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:var(--sb);flex-shrink:0;border-bottom:1px solid var(--bdd)}
.logo{cursor:pointer;display:flex;align-items:center}.logo img{height:36px;display:block;object-fit:contain;transition:opacity .2s}.logo:hover img{opacity:.8}
.topbar-link{color:rgba(255,255,255,.7);font-size:12px;text-decoration:none;padding:6px 14px;border:1px solid rgba(255,255,255,.15);border-radius:6px;transition:all .2s;display:inline-flex;align-items:center;gap:5px}.topbar-link:hover{background:rgba(255,255,255,.1);color:#fff}
.body{display:flex;flex:1;overflow:hidden}
.sidebar{width:240px;background:var(--sb);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0;border-right:1px solid var(--bdd)}.sidebar::-webkit-scrollbar{width:4px}.sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}
.section{border-bottom:1px solid var(--bdd)}
.sec-hd{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;user-select:none;transition:background .15s}.sec-hd:hover{background:var(--sh)}
.sec-num{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.6);flex-shrink:0}
.sec-title{color:#fff;font-size:13px;font-weight:500;flex:1}
.sec-arrow{color:rgba(255,255,255,.3);font-size:10px;transition:transform .2s;display:inline-block}.sec-arrow.open{transform:rotate(90deg)}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 16px 9px 28px;cursor:pointer;transition:all .15s;border-left:2px solid transparent}.nav-item:hover{background:var(--sh)}.nav-item.active{background:var(--sa);border-left-color:#3b82f6}
.nav-dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.2);flex-shrink:0}.nav-item.active .nav-dot{background:#3b82f6}
.nav-label{color:rgba(255,255,255,.6);font-size:12px;flex:1;line-height:1.3}.nav-item.active .nav-label,.nav-item:hover .nav-label{color:#fff}
.badge{font-size:10px;padding:2px 7px;border-radius:4px;font-weight:500;flex-shrink:0}.badge-ai{background:rgba(139,92,246,.25);color:#c4b5fd}.badge-yt{background:rgba(239,68,68,.2);color:#fca5a5}
.main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.main-hd{padding:14px 22px;border-bottom:1px solid var(--bd);background:var(--sf);display:flex;align-items:center;gap:12px;flex-shrink:0}
.breadcrumb{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--tm)}.main-title{font-size:15px;font-weight:600;color:var(--tp)}
.pill{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:500}.pill-app{background:#eff6ff;color:#2563eb}.pill-ai{background:#f5f3ff;color:#7c3aed}.pill-yt{background:#fef2f2;color:#dc2626}
.content{flex:1;display:flex;flex-direction:column;overflow:hidden}
.info-panel{flex:1;padding:32px;overflow-y:auto;display:flex;flex-direction:column;gap:20px}
.info-card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:28px;display:flex;flex-direction:column;gap:16px;max-width:600px}
.info-name{font-size:20px;font-weight:700;color:var(--tp)}.info-row{display:flex;align-items:flex-start;gap:14px}
.info-key{font-size:12px;color:var(--tm);min-width:60px;padding-top:1px}.info-val{font-size:13px;color:var(--tp);flex:1;word-break:break-all}.info-val a{color:#3b82f6;text-decoration:none}.info-val a:hover{text-decoration:underline}
.code-chip{display:inline-flex;align-items:center;gap:10px;background:#f5f3ff;border:1px solid #e9d5ff;border-radius:10px;padding:10px 16px;align-self:flex-start}
.code-lbl{font-size:11px;color:#7c3aed}.code-val{font-family:monospace;font-size:15px;font-weight:700;color:#6d28d9;letter-spacing:2px}
.open-btn{display:inline-flex;align-items:center;gap:8px;padding:11px 24px;background:var(--navy);color:#fff;border-radius:8px;font-size:13px;font-weight:600;text-decoration:none;transition:all .2s;align-self:flex-start;cursor:pointer;border:none}.open-btn:hover{background:#2563eb;transform:translateY(-1px)}
.home{flex:1;overflow-y:auto;background:#f8f9fb;display:flex;align-items:center;justify-content:center;padding:32px}
.home-banner-wrap{width:100%;max-width:960px;display:flex;align-items:center;justify-content:center}
.banner-img{width:100%;height:auto;object-fit:contain}
.footer{background:var(--sb);border-top:1px solid var(--bdd);padding:14px 22px;flex-shrink:0}
.footer-inner{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.footer-info{color:rgba(255,255,255,.4);font-size:11px;line-height:1.9}.footer-info strong{color:rgba(255,255,255,.65);font-weight:500}
.footer-copy{color:rgba(255,255,255,.25);font-size:11px}
</style>
</head>
