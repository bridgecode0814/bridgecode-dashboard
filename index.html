<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BridgeCode Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body, #root { height: 100%; font-family: 'Noto Sans KR', sans-serif; }
:root {
  --sidebar-bg: #0f1117;
  --sidebar-hover: #1a1d27;
  --sidebar-active: #1e2235;
  --accent: #1a2f6e;
  --border: #e5e7eb;
  --border-dark: rgba(255,255,255,0.08);
  --text-primary: #111827;
  --text-secondary: #6b7280;
  --text-muted: #9ca3af;
  --bg: #f9fafb;
  --surface: #ffffff;
}
.app { display: flex; flex-direction: column; height: 100vh; background: var(--bg); }
.topbar {
  height: 60px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; background: var(--sidebar-bg); flex-shrink: 0;
  border-bottom: 1px solid var(--border-dark);
}
.logo img { height: 36px; display: block; object-fit: contain; }
.topbar-link {
  color: rgba(255,255,255,0.7); font-size: 12px; text-decoration: none;
  padding: 6px 14px; border: 1px solid rgba(255,255,255,0.15); border-radius: 6px;
  transition: all 0.2s; display: inline-flex; align-items: center; gap: 5px;
}
.topbar-link:hover { background: rgba(255,255,255,0.1); color: #fff; }
.body { display: flex; flex: 1; overflow: hidden; }
.sidebar {
  width: 240px; background: var(--sidebar-bg); display: flex; flex-direction: column;
  overflow-y: auto; flex-shrink: 0; border-right: 1px solid var(--border-dark);
}
.sidebar::-webkit-scrollbar { width: 4px; }
.sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
.section { border-bottom: 1px solid var(--border-dark); }
.section-header {
  display: flex; align-items: center; gap: 10px; padding: 12px 16px;
  cursor: pointer; user-select: none; transition: background 0.15s;
}
.section-header:hover { background: var(--sidebar-hover); }
.section-num {
  width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center;
  justify-content: center; font-size: 10px; font-weight: 700;
  border: 1px solid rgba(255,255,255,0.2); color: rgba(255,255,255,0.6); flex-shrink: 0;
}
.section-title { color: #fff; font-size: 13px; font-weight: 500; flex: 1; }
.section-arrow { color: rgba(255,255,255,0.3); font-size: 10px; transition: transform 0.2s; display: inline-block; }
.section-arrow.open { transform: rotate(90deg); }
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 9px 16px 9px 28px;
  cursor: pointer; transition: all 0.15s; border-left: 2px solid transparent;
}
.nav-item:hover { background: var(--sidebar-hover); }
.nav-item.active { background: var(--sidebar-active); border-left-color: #3b82f6; }
.nav-dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,0.2); flex-shrink: 0; }
.nav-item.active .nav-dot { background: #3b82f6; }
.nav-label { color: rgba(255,255,255,0.6); font-size: 12px; flex: 1; line-height: 1.3; }
.nav-item.active .nav-label, .nav-item:hover .nav-label { color: #fff; }
.badge { font-size: 10px; padding: 2px 7px; border-radius: 4px; font-weight: 500; flex-shrink: 0; }
.badge-ai { background: rgba(139,92,246,0.25); color: #c4b5fd; }
.badge-yt { background: rgba(239,68,68,0.2); color: #fca5a5; }
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.main-header {
  padding: 14px 22px; border-bottom: 1px solid var(--border); background: var(--surface);
  display: flex; align-items: center; gap: 12px; flex-shrink: 0;
}
.breadcrumb { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); }
.main-title { font-size: 15px; font-weight: 600; color: var(--text-primary); }
.type-pill { font-size: 11px; padding: 3px 10px; border-radius: 20px; font-weight: 500; }
.pill-app { background: #eff6ff; color: #2563eb; }
.pill-ai  { background: #f5f3ff; color: #7c3aed; }
.pill-yt  { background: #fef2f2; color: #dc2626; }
.content-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.welcome {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 6px; color: var(--text-muted);
}
.welcome-icon {
  width: 52px; height: 52px; border: 1.5px dashed var(--border); border-radius: 14px;
  display: flex; align-items: center; justify-content: center; margin-bottom: 10px; color: var(--text-muted);
}
.welcome h2 { font-size: 15px; font-weight: 500; color: var(--text-secondary); }
.welcome p  { font-size: 13px; }
.info-panel { flex: 1; padding: 32px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
.info-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  padding: 28px; display: flex; flex-direction: column; gap: 16px; max-width: 600px;
}
.info-card-name { font-size: 20px; font-weight: 700; color: var(--text-primary); }
.info-row { display: flex; align-items: flex-start; gap: 14px; }
.info-key { font-size: 12px; color: var(--text-muted); min-width: 60px; padding-top: 1px; }
.info-val { font-size: 13px; color: var(--text-primary); flex: 1; word-break: break-all; }
.info-val a { color: #3b82f6; text-decoration: none; }
.info-val a:hover { text-decoration: underline; }
.code-chip {
  display: inline-flex; align-items: center; gap: 10px;
  background: #f5f3ff; border: 1px solid #e9d5ff; border-radius: 10px;
  padding: 10px 16px; align-self: flex-start;
}
.code-chip-label { font-size: 11px; color: #7c3aed; }
.code-chip-val { font-family: monospace; font-size: 15px; font-weight: 700; color: #6d28d9; letter-spacing: 2px; }
.open-btn {
  display: inline-flex; align-items: center; gap: 8px; padding: 11px 24px;
  background: #1a2f6e; color: #fff; border-radius: 8px;
  font-size: 13px; font-weight: 600; text-decoration: none;
  transition: all 0.2s; align-self: flex-start; cursor: pointer; border: none;
}
.open-btn:hover { background: #2563eb; transform: translateY(-1px); }
.footer {
  background: var(--sidebar-bg); border-top: 1px solid var(--border-dark);
  padding: 14px 22px; flex-shrink: 0;
}
.footer-inner { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
.footer-info { color: rgba(255,255,255,0.4); font-size: 11px; line-height: 1.9; }
.footer-info strong { color: rgba(255,255,255,0.65); font-weight: 500; }
.footer-copy { color: rgba(255,255,255,0.25); font-size: 11px; }
</style>
</head>

function Section({ sec, activeId, onSelect }) {
  const [open, setOpen] = useState(true);
  return h('div', { className: 'section' },
    h('div', { className: 'section-header', onClick: () => setOpen(o => !o) },
      h('div', { className: 'section-num' }, sec.num),
      h('span', { className: 'section-title' }, sec.title),
      h('span', { className: 'section-arrow' + (open ? ' open' : '') }, '▶')
    ),
    open && sec.items.map(item =>
      h('div', {
        key: item.id,
        className: 'nav-item' + (activeId === item.id ? ' active' : ''),
        onClick: () => onSelect(item)
      },
        h('div', { className: 'nav-dot' }),
        h('span', { className: 'nav-label' }, item.id + '. ' + item.label),
        item.badge ? h('span', { className: 'badge ' + item.badge }, item.badgeText) : null
      )
    )
  );
}

function InfoPanel({ item }) {
  return h('div', { className: 'info-panel' },
    h('div', { className: 'info-card' },
      h('div', { className: 'info-card-name' }, item.label),
      h('div', { className: 'info-row' },
        h('span', { className: 'info-key' }, '플랫폼'),
        h('span', { className: 'info-val' }, item.platform)
      ),
      h('div', { className: 'info-row' },
        h('span', { className: 'info-key' }, 'URL'),
        h('span', { className: 'info-val' },
          h('a', { href: item.url, target: '_blank', rel: 'noreferrer' }, item.url)
        )
      ),
      item.code ? h('div', { className: 'code-chip' },
        h('span', { className: 'code-chip-label' }, '입장 코드'),
        h('span', { className: 'code-chip-val' }, item.code)
      ) : null,
      h('a', { className: 'open-btn', href: item.url, target: '_blank', rel: 'noreferrer' }, '열기 ↗')
    )
  );
}

function MainContent({ selected }) {

    return h('div', { className: 'welcome' },
      h('div', { className: 'welcome-icon' },
        h('svg', { width: 24, height: 24, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: '1.5' },

  return h('div', { className: 'content-area' },
    h('div', { className: 'main-header' },
      h('div', { className: 'breadcrumb' },
        h('span', null, section ? section.title : ''),
        h('span', { style: { color: '#e5e7eb' } }, ' › ')

      h('span', { className: 'main-title' }, selected.label),
      h('span', { className: 'type-pill ' + (PILL_CLASS[selected.type] || '') },
        PILL_TEXT[selected.type] || ''
      )
    ),
    h(InfoPanel, { item: selected })
  );
}
